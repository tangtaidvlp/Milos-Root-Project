server {
    listen 4173;
    server_name yourdomain.com; # Replace with your IP or domain

    root /home/ec2-user/Project/ui-personal-routine-manager/milos-ui-0.0.1;
    index index.html;

    # Forward API calls to the Spring Boot backend on the same instance.
    # Without this, /api/* falls through to the static location below,
    # which only serves GET/HEAD and returns 405 for everything else.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Critical for React Router: serves index.html on direct URL reloads
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets for performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Enable GZIP compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}